spring:
  application:
    name: ACMParcelDev
  profiles:
    active:
      - dev
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
  data:
    redis:
      url: ${REDIS_URL}
      ssl:
        enabled: true
  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false
    properties:
      hibernate.hibernate.default_schema: app
jwt:
  secret: ${JWT_SECRET}